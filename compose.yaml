name: wtg-downdetector

x-app-environment: &app-environment
  DATABASE_URL: postgresql://${POSTGRES_USER:-wtg}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-wtg_downdetector}
  DIRECT_URL: postgresql://${POSTGRES_USER:-wtg}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-wtg_downdetector}

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wtg_downdetector}
      POSTGRES_USER: ${POSTGRES_USER:-wtg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    build: .
    command: ["node", "node_modules/prisma/build/index.js", "migrate", "deploy"]
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build: .
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      <<: *app-environment
      REPORTER_HMAC_SECRET: ${REPORTER_HMAC_SECRET:?set REPORTER_HMAC_SECRET}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    profiles: ["notifications"]
    build: .
    command: ["node", "dist/worker.cjs"]
    environment:
      <<: *app-environment
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:?set SMTP_FROM}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:
